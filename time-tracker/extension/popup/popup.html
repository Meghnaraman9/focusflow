<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>FocusFlow</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0d0d0f;
      --surface: #16161a;
      --border: #2a2a30;
      --accent: #e8ff47;
      --accent2: #ff6b35;
      --productive: #47ffb2;
      --unproductive: #ff4f4f;
      --neutral: #8888aa;
      --text: #f0f0f5;
      --text-dim: #7070aa;
    }

    body {
      width: 340px;
      min-height: 420px;
      background: var(--bg);
      color: var(--text);
      font-family: 'Syne', sans-serif;
      padding: 0;
      overflow-x: hidden;
    }

    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 14px 18px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      display: flex; align-items: center; gap: 8px;
    }
    .logo-dot {
      width: 10px; height: 10px;
      border-radius: 50%;
      background: var(--accent);
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(0.8); }
    }
    .logo-text { font-size: 15px; font-weight: 800; letter-spacing: 0.02em; }
    .logo-text span { color: var(--accent); }

    .dashboard-btn {
      font-family: 'Syne', sans-serif;
      font-size: 10px; font-weight: 600;
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-dim);
      padding: 4px 10px; border-radius: 20px;
      cursor: pointer; transition: all 0.2s;
      text-decoration: none;
    }
    .dashboard-btn:hover { border-color: var(--accent); color: var(--accent); }

    .current-site {
      margin: 14px 18px 0;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 14px;
    }
    .current-label { font-size: 9px; font-weight: 600; letter-spacing: 0.1em; color: var(--text-dim); text-transform: uppercase; margin-bottom: 6px; }
    .current-domain {
      font-family: 'DM Mono', monospace;
      font-size: 13px; font-weight: 500;
      color: var(--text);
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .current-badge {
      display: inline-block; margin-top: 6px;
      padding: 2px 8px; border-radius: 20px;
      font-size: 9px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase;
    }
    .badge-productive { background: rgba(71,255,178,0.15); color: var(--productive); }
    .badge-unproductive { background: rgba(255,79,79,0.15); color: var(--unproductive); }
    .badge-neutral { background: rgba(136,136,170,0.15); color: var(--neutral); }

    .stats-grid {
      display: grid; grid-template-columns: 1fr 1fr;
      gap: 10px; margin: 12px 18px 0;
    }
    .stat-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px; padding: 12px 14px;
    }
    .stat-label { font-size: 9px; font-weight: 600; letter-spacing: 0.1em; color: var(--text-dim); text-transform: uppercase; }
    .stat-value { font-size: 22px; font-weight: 800; margin-top: 4px; line-height: 1; }
    .stat-unit { font-size: 11px; font-weight: 400; color: var(--text-dim); margin-left: 2px; }

    .bar-section { margin: 14px 18px 0; }
    .bar-label { font-size: 9px; font-weight: 600; letter-spacing: 0.1em; color: var(--text-dim); text-transform: uppercase; margin-bottom: 8px; }
    .bar-row { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
    .bar-name {
      font-family: 'DM Mono', monospace; font-size: 10px; color: var(--text-dim);
      width: 100px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .bar-track { flex: 1; height: 5px; background: var(--border); border-radius: 3px; overflow: hidden; }
    .bar-fill { height: 100%; border-radius: 3px; transition: width 0.6s ease; }
    .bar-time { font-family: 'DM Mono', monospace; font-size: 10px; color: var(--text-dim); width: 36px; text-align: right; }

    .footer {
      margin: 14px 18px 16px;
      display: flex; gap: 8px;
    }
    .btn {
      flex: 1; font-family: 'Syne', sans-serif;
      font-size: 11px; font-weight: 700;
      border: none; border-radius: 8px;
      padding: 9px; cursor: pointer;
      transition: all 0.2s;
    }
    .btn-primary {
      background: var(--accent); color: #0d0d0f;
    }
    .btn-primary:hover { background: #d4eb00; transform: translateY(-1px); }
    .btn-secondary {
      background: var(--surface); color: var(--text-dim);
      border: 1px solid var(--border);
    }
    .btn-secondary:hover { border-color: var(--accent2); color: var(--accent2); }

    .empty { text-align: center; color: var(--text-dim); font-size: 12px; padding: 16px 0; }
  </style>
</head>
<body>
  <header>
    <div class="logo">
      <div class="logo-dot"></div>
      <span class="logo-text">Focus<span>Flow</span></span>
    </div>
    <a class="dashboard-btn" href="dashboard/dashboard.html" target="_blank">Full Dashboard →</a>
  </header>

  <div class="current-site">
    <div class="current-label">Currently Tracking</div>
    <div class="current-domain" id="current-domain">Loading…</div>
    <span class="current-badge" id="current-badge">–</span>
  </div>

  <div class="stats-grid">
    <div class="stat-card">
      <div class="stat-label">Today Total</div>
      <div class="stat-value" id="today-total">0<span class="stat-unit">m</span></div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Productive</div>
      <div class="stat-value" style="color:var(--productive)" id="productive-pct">0<span class="stat-unit">%</span></div>
    </div>
  </div>

  <div class="bar-section">
    <div class="bar-label">Top Sites Today</div>
    <div id="top-sites"></div>
  </div>

  <div class="footer">
    <button class="btn btn-primary" id="dashboard-btn">Open Dashboard</button>
    <button class="btn btn-secondary" id="clear-btn">Clear Today</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
